<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Narrator</title>
    <link rel="stylesheet" href="https://use.typekit.net/dvx3wrs.css">
    <link rel="stylesheet" href="Narrator.css">
    <style>
        #characterReveal {
            position: fixed;
            bottom: 0;
            left: -400px;
            display: none;
            flex-direction: row;
            align-items: flex-end;
            gap: 20px;
            padding: 20px;
            z-index: 100;
            transition: left 0.6s ease-out;
        }
        #characterReveal.slide-in {
            left: 0;
        }
        #characterReveal img {
            max-width: 10em;
            height: auto;
        }
    </style>
</head>
<body>

<div class="click-hint" id="clickHint" style="font-family: 'pf-videotext', sans-serif;">Click to continue</div>

<div id="characterReveal">
    <a href="../yutsun/index.html">
        <img src="YuTsun Treated.png" alt="Yu Tsun">
    </a>
    <div class="peek-text">
        <h3>Who is that?!</h3>
        <p>Click to examine</p>
    </div>
</div>

<a href="../character-select.html" class="reveal">Character Select</a>
<h1 class="reveal">YOU ARE THE NARRATOR</h1>
<p class="reveal">Your life is orderly and private.</p>
<p class="reveal">An infinite object enters it and disrupts everything.</p>
<h2 class="reveal">The Apartment</h2>
<a href="apartment.html" class="reveal door-link">
    <img src="AdobeStock_802672660.png" alt="The Apartment Door">
</a>
<p class="reveal">click to enter</p>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const revealElements = document.querySelectorAll('.reveal');
    let currentIndex = 0;
    let yuTsunShown = false;

    revealElements.forEach(el => el.style.display = 'none');

    function dismissHint() {
        const hint = document.getElementById('clickHint');
        if (hint) {
            hint.style.transition = 'opacity 0.5s';
            hint.style.opacity = '0';
            setTimeout(() => hint.remove(), 500);
        }
    }

    function revealNext() {
        if (currentIndex >= revealElements.length) return;
        const el = revealElements[currentIndex];
        el.style.display = 'block';
        el.style.opacity = '0';
        setTimeout(() => {
            el.style.transition = 'opacity 0.5s';
            el.style.opacity = '1';
            currentIndex++;
        }, 50);
    }

    function showYuTsun() {
        const cr = document.getElementById('characterReveal');
        cr.style.display = 'flex';
        cr.getBoundingClientRect();
        cr.classList.add('slide-in');
    }

    document.addEventListener('click', function(e) {
        dismissHint();

        if (e.target.closest('#characterReveal')) return;

        if (e.target.closest('.door-link')) {
            const door = e.target.closest('.door-link');
            if (door.style.display === 'none') {
                e.preventDefault();
                return;
            }
            e.preventDefault();
            if (!yuTsunShown) {
                yuTsunShown = true;
                showYuTsun();
            } else {
                window.location.href = 'apartment.html';
            }
            return;
        }

        const link = e.target.closest('a');
        if (link) return;

        revealNext();
    });
});
</script>

</body>
</html>
